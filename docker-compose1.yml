services:
  redis:
    image: redis:alpine
    container_name: redis_def_manager
    env_file:
      - .env
    ports:
      - "6380:6379"
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-beat:
    build: .
    command: celery -A config.tasks_config beat --loglevel=info
    # volumes:
    #   - .:/app 
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-parsing:
    build: .
    # volumes:
    #   - .:/app   # монтируем текущую папку в /app внутри контейнера
    command: celery -A config.tasks_config worker -Q parsing --concurrency=1 --hostname=worker-parsing@%h
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - POSTGRES_HOST=host.docker.internal # преопределение подключения к локальной бд
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-messages:
    build: .
    # volumes:
    #   - .:/app 
    command: celery -A config.tasks_config worker -Q messages --concurrency=2 -n=worker-messages@%h
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-parsing-efrsb:
      # image: ghcr.io/borski/patchright-docker
      build:
        context: .
        dockerfile: Dockerfile.celery
      init: true
      entrypoint: []                #  сбрасываем entrypoint образа
      # command: celery -A config.tasks_config worker -Q parsing_efrsb --concurrency=1 --hostname=worker-parsing-efrsb@%h
      command: >
        xvfb-run -a --server-args="-screen 0 1920x1080x24"
        celery -A config.tasks_config worker
        -Q parsing_efrsb
        --concurrency=1
        --hostname=worker-parsing-efrsb@%h
      volumes:
        - .:/app
        - ./screens:/app/screens
      depends_on:
        redis:
          condition: service_healthy
      env_file:
        - .env
      environment:
        - POSTGRES_HOST=host.docker.internal # преопределение подключения к локальной бд
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - PYTHONPATH=/app
      shm_size: '1gb' 
      restart: always

  celery-flower:
    build: .
    # volumes:
    #   - .:/app 
    command: celery -A config.tasks_config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

volumes:
  redis_data:
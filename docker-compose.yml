services:
  redis:
    image: redis:alpine
    container_name: redis_def_manager
    env_file:
      - .env
    ports:
      - "6380:6379"
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-beat:
    build: .
    command: celery -A config.tasks_config beat --loglevel=info
    # volumes:
    #   - .:/app 
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-parsing:
    build: .
    image: ghcr.io/borski/patchright-docker
    # volumes:
    #   - .:/app   # монтируем текущую папку в /app внутри контейнера
    command: celery -A config.tasks_config worker -Q parsing --concurrency=1 --hostname=worker-parsing@%h
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-messages:
    build: .
    # volumes:
    #   - .:/app 
    command: celery -A config.tasks_config worker -Q messages --concurrency=2 -n=worker-messages@%h
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

  celery-worker-parsing-efrsb:
    # build: .
    image: ghcr.io/borski/patchright-docker
    init: true

    entrypoint: >
      sh -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 && exec \"$0\" \"$@\""

    volumes:
      - .:/app
      - ./screens:/app/screens             # папка для скриншотов
    command: celery -A config.tasks_config worker -Q parsing_efrsb --concurrency=1 --hostname=worker-efrsb@%h
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DISPLAY=:99
      - PYTHONPATH=/app
    restart: always

  celery-flower:
    build: .
    # volumes:
    #   - .:/app 
    command: celery -A config.tasks_config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env_mail
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONPATH=/app
    restart: always

volumes:
  redis_data:
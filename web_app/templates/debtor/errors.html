  {# ---------- Ошибки валидации ---------- #}
  {% if errors %}
    <div class="alert alert-danger" role="alert">
      <div class="fw-semibold mb-2">Форма содержит ошибки:</div>
      <ul class="mb-0 ps-3">
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
